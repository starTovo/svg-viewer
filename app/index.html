<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#F9FAFB" />
<meta name="color-scheme" content="light dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>SVG Studio · 打开 / 编辑 / 缩放 / 导出</title>
<style>
/* ============================================================
   Lumen UI · Design Tokens
   ============================================================ */
:root{
  /* Light theme (default) */
  /* Three-level background hierarchy so the chrome reads as a frame around the
     content: canvas (content ground) < surface (bars / cards) < subtle (hover).
     Chrome bars use --bg-surface, panes use --bg-canvas, panels inside a pane
     use --bg-surface again. */
  --bg-canvas:#F4F5F7;
  --bg-surface:#FFFFFF;
  --bg-subtle:#EAECF0;
  --border-default:#E4E7EC;
  --border-strong:#D0D5DD;
  --text-primary:#101828;
  --text-secondary:#475467;
  --text-tertiary:#667085;
  --accent:#5E6AD2;
  --accent-hover:#4B55B8;
  --success:#0FA968;
  --warning:#DC6803;
  --danger:#D92D20;

  --accent-soft:rgba(94,106,210,0.12);
  --success-soft:rgba(15,169,104,0.12);
  --danger-soft:rgba(217,45,32,0.10);
  --overlay:rgba(16,24,40,0.45);

  /* Checkerboard (transparency) */
  --chk-a:rgba(16,24,40,0.06);
  --chk-b:#FFFFFF;

  /* Code editor edge fades: explicit rgb stops (not `transparent`) so the
     gradient cannot pick up a dark halo on old premultiplied engines. */
  --code-fade-0:rgba(255,255,255,0);
  --code-fade-1:#FFFFFF;

  /* Shadow */
  --shadow-sm:0 1px 3px 0 rgba(16,24,40,0.10), 0 1px 2px 0 rgba(16,24,40,0.06);
  --shadow-md:0 4px 8px -2px rgba(16,24,40,0.10), 0 2px 4px -2px rgba(16,24,40,0.06);
  --shadow-lg:0 12px 24px -4px rgba(16,24,40,0.18), 0 4px 8px -4px rgba(16,24,40,0.10);
  /* Directional edge shadows: the top bar casts downwards, the bottom bars
     cast upwards. Paired with --border-strong this makes every region edge
     readable at a glance without drawing heavy card borders. */
  --shadow-bar-down:0 1px 3px 0 rgba(16,24,40,0.10), 0 1px 2px 0 rgba(16,24,40,0.06);
  --shadow-bar-up:0 -1px 3px 0 rgba(16,24,40,0.10), 0 -1px 2px 0 rgba(16,24,40,0.06);

  /* Radius */
  --r-control:6px;
  --r-card:12px;
  --r-full:9999px;

  /* Motion */
  --ease-out:cubic-bezier(0.25, 1, 0.5, 1);
  --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
  --duration-xs:120ms;
  --duration-sm:160ms;
  --duration-md:200ms;
  --duration-lg:280ms;

  /* Metrics */
  --h-appbar:52px;
  --h-tabbar:56px;
  --h-status:32px;
  --h-control:32px;

  /* Native bridge: status bar height in CSS px. The host Activity sets it via
     SvgApp.setStatusBarHeight(); 0 means "web only / no inset". */
  --statusbar-h:0px;

  /* Fonts: system stack only, no external font loading (offline WebView).
     "Noto Sans SC" is the alias newer Android builds expose for the CJK face
     ("Noto Sans CJK SC" is the older name); both are listed so the Chinese
     glyphs never fall through to a mismatched replacement face. */
  --font-sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
              "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
              "Source Han Sans SC", "Noto Sans CJK SC", "Noto Sans SC",
              sans-serif;
  /* "Droid Sans Mono" / "Noto Sans Mono" are the real monospace faces shipped
     in AOSP. Without them the generic `monospace` keyword can resolve to a
     proportional face on some Android builds, which silently breaks the code
     editor grid. */
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas,
              "Liberation Mono", "Droid Sans Mono", "Noto Sans Mono",
              "Courier New", monospace;
}
[data-theme="dark"]{
  --bg-canvas:#0A0B0D;
  --bg-surface:#131417;
  --bg-subtle:#1D2024;
  --border-default:#24262B;
  --border-strong:#31343A;
  --text-primary:#F5F6F7;
  --text-secondary:#A9AFB8;
  --text-tertiary:#8A9099;
  --accent:#6E79E8;
  --accent-hover:#8A93F0;
  --success:#3DBF87;
  --warning:#F79009;
  --danger:#F97066;

  --accent-soft:rgba(110,121,232,0.18);
  --success-soft:rgba(61,191,135,0.16);
  --danger-soft:rgba(249,112,102,0.14);
  --overlay:rgba(0,0,0,0.55);

  --chk-a:rgba(255,255,255,0.07);
  --chk-b:#000000;

  --code-fade-0:rgba(19,20,23,0);
  --code-fade-1:#131417;

  --shadow-sm:0 1px 3px 0 rgba(0,0,0,0.45), 0 1px 2px 0 rgba(0,0,0,0.30);
  --shadow-md:0 4px 8px -2px rgba(0,0,0,0.50), 0 2px 4px -2px rgba(0,0,0,0.35);
  --shadow-lg:0 12px 24px -4px rgba(0,0,0,0.60), 0 4px 8px -4px rgba(0,0,0,0.40);
  --shadow-bar-down:0 1px 3px 0 rgba(0,0,0,0.55), 0 1px 2px 0 rgba(0,0,0,0.35);
  --shadow-bar-up:0 -1px 3px 0 rgba(0,0,0,0.55), 0 -1px 2px 0 rgba(0,0,0,0.35);
}

/* ============================================================
   Base -- tuned for a full screen Android WebView
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html{
  height:100%;
  margin:0;
  padding:0;
  /* Kill pull-to-refresh / overscroll glow in the WebView. */
  overscroll-behavior:none;
  overscroll-behavior-y:none;
  /* Android text inflation: pin the scale on the ROOT element too. body
     already had it, but pinning html makes the value impossible to lose
     through any subtree that resets it. */
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;
  padding:0;
  /* Never rely on 100vh alone: the soft keyboard and the status bar change the
     real viewport. --app-h is written by JS from visualViewport; 100dvh is the
     CSS fallback; 100vh is the last resort for very old engines. */
  height:100vh;
  height:var(--app-h, 100vh);
  font-family:var(--font-sans);
  font-size:13px;
  font-weight:400;
  line-height:20px;
  color:var(--text-primary);
  background:var(--bg-canvas);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  /* App chrome is not selectable; the code editor re-enables selection. */
  -webkit-user-select:none;
  user-select:none;
  /* Avoid the 300ms tap delay without disabling canvas gestures. */
  touch-action:manipulation;
  /* Room for the fixed bottom tab bar (phone only). */
  padding-bottom:calc(var(--h-tabbar) + env(safe-area-inset-bottom, 0px));
}
@supports (height:100dvh){
  body{ height:var(--app-h, 100dvh); }
}

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:var(--r-control);
}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
/* Replaced elements (the editor textarea and the two text inputs) do not
   reliably inherit -webkit-text-size-adjust on every Android WebView build;
   when the inherited value is dropped the field text renders larger than the
   rest of the UI. Pinned explicitly here. */
.code-area,.file-input,.path-input{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

/* ============================================================
   Top app bar
   ============================================================ */
.appbar{
  flex:0 0 auto;
  position:relative;
  z-index:20;
  display:flex;
  align-items:center;
  gap:8px;
  height:calc(var(--h-appbar) + var(--statusbar-h) + env(safe-area-inset-top, 0px));
  padding:calc(var(--statusbar-h) + env(safe-area-inset-top, 0px)) 6px 0 12px;
  background:var(--bg-surface);
  /* Hierarchy: the bar is the lightest plane and casts downward onto the
     canvas, so its lower edge is unmistakable. */
  border-bottom:1px solid var(--border-strong);
  box-shadow:var(--shadow-bar-down);
}
.brand{
  flex:0 1 auto;
  display:flex;
  align-items:center;
  min-width:0;
  overflow:hidden;
}
.brand-name{
  font-size:14px;font-weight:600;line-height:18px;letter-spacing:-0.01em;
  color:var(--text-primary);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
/* The bar is ONE row of [gear][brand][rename field][tools] wherever that fits
   (>= 480px). Below that the row cannot hold gear(44) + brand + rename field
   + 4 tools(176) with every target >= 44px: at 360px it overflows by ~26px,
   and at 390px the rename field would be squeezed to its 64px floor. So v3
   grows a SECOND row instead of hiding the wordmark -- v2 hid it, which was
   the exact opposite of the user feedback ("the name at the top is not
   obvious"). Row 1 = gear + title, row 2 = rename field + tools. */
.appbar-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.appbar-row-1{flex:0 0 auto;}
.appbar-row-2{flex:1 1 auto;min-width:0;}
@media (max-width:479px){
  .appbar{
    flex-direction:column;
    align-items:stretch;
    gap:4px;
    height:auto;
    padding-bottom:2px;
  }
}
/* The <input> is a replaced element: Chromium never renders ::before/::after on
   it, so the >=44px touch zone lives on this <label> instead (padding + equal
   negative margin keeps the 52px bar rhythm). Clicking the padding is native
   label activation -- nothing overlaps, nothing is absolutely positioned.
   NOTE: hover/focus must use background-color + explicit background-clip, never
   the `background` shorthand, or background-clip resets to border-box and the
   44px zone paints an opaque block over the brand title. */
/* The rename affordance lives on the <label>: Chromium renders no ::before /
   ::after on a replaced <input>, so the dashed field outline, the pencil glyph
   and the >=44px touch zone are all real elements on the label. Nothing is
   absolutely positioned and nothing sets pointer-events:none, so the whole
   pill stays clickable (that was the v1 regression). */
.file-wrap{
  flex:1 1 auto;
  display:flex;
  align-items:center;
  gap:6px;
  min-width:64px;
  height:44px;
  padding:0 8px 0 10px;
  margin:0 -2px;
  border:1px dashed var(--border-strong);
  border-radius:var(--r-control);
  background-color:var(--bg-canvas);
  cursor:text;
  transition:border-color var(--duration-sm) var(--ease-out),
             background-color var(--duration-sm) var(--ease-out);
}
.file-wrap:hover{
  border-color:var(--accent);
  background-color:var(--bg-subtle);
}
.file-wrap:focus-within{
  border-style:solid;
  border-color:var(--accent);
  background-color:var(--bg-surface);
  box-shadow:0 0 0 2px var(--accent-soft);
}
.file-ico{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--text-tertiary);
  transition:color var(--duration-sm) var(--ease-out);
}
.file-ico svg{width:14px;height:14px;display:block;}
.file-wrap:hover .file-ico,
.file-wrap:focus-within .file-ico{color:var(--accent);}

.file-input{
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  line-height:20px;
  letter-spacing:-0.01em;
  height:28px;
  color:var(--text-primary);
  background-color:transparent;
  background-clip:content-box;
  border:0;
  border-radius:4px;
  padding:0;
  width:100%;
  min-width:0;
  text-overflow:ellipsis;
  -webkit-user-select:text;
  user-select:text;
  -webkit-appearance:none;
  appearance:none;
  outline:none;
}
.file-input::placeholder{color:var(--text-tertiary);font-weight:400;}

.tools{
  flex:0 0 auto;
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:0;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.tools::-webkit-scrollbar{display:none;}

.icon-btn{
  -webkit-appearance:none;
  appearance:none;
  flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;
  padding:0;
  border:0;
  background-color:transparent;
  color:var(--text-secondary);
  border-radius:var(--r-control);
  cursor:pointer;
  transition:background-color var(--duration-sm) var(--ease-out),
             color var(--duration-sm) var(--ease-out),
             transform var(--duration-xs) var(--ease-out);
}
.icon-btn:hover{background-color:var(--bg-subtle);color:var(--text-primary);}
.icon-btn:active{transform:scale(0.92);}
.icon-btn svg{width:18px;height:18px;display:block;}

/* ============================================================
   Main area / panes
   ============================================================ */
.app{
  flex:1 1 auto;
  min-height:0;
  position:relative;
  display:block;
}
.pane{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  min-height:0;
  background:var(--bg-canvas);
  opacity:0;
  visibility:hidden;
  /* IMPORTANT: pointer-events is inherited. Every interactive child inside a
     hidden pane must get `auto` back from the body[data-view=...] rule below --
     and anything that must stay live even while its pane is hidden (none today)
     has to declare it explicitly. */
  pointer-events:none;
  transform:translateY(8px);
  transition:opacity var(--duration-sm) var(--ease-out),
             transform var(--duration-sm) var(--ease-out),
             visibility 0s linear var(--duration-sm);
}
body[data-view="preview"] .pane-preview,
body[data-view="code"] .pane-code{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateY(0);
  transition:opacity var(--duration-sm) var(--ease-out),
             transform var(--duration-sm) var(--ease-out),
             visibility 0s linear 0s;
}

/* ============================================================
   Preview
   ============================================================ */
.pane-preview{position:absolute;background:var(--bg-canvas);}
.viewport{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  /* The canvas owns every gesture: no browser pan/zoom here. */
  touch-action:none;
  contain:layout paint;
  user-select:none;
  -webkit-user-select:none;
}
.viewport[data-bg="checker"]{
  background-color:var(--chk-b);
  background-image:
    linear-gradient(45deg, var(--chk-a) 25%, transparent 25%, transparent 75%, var(--chk-a) 75%),
    linear-gradient(45deg, var(--chk-a) 25%, transparent 25%, transparent 75%, var(--chk-a) 75%);
  background-size:24px 24px;
  background-position:0 0, 12px 12px;
}
.viewport[data-bg="white"]{background-color:#FFFFFF;background-image:none;}
.viewport[data-bg="black"]{background-color:#000000;background-image:none;}

.stage{
  position:absolute;
  left:0;top:0;
  transform-origin:0 0;
  will-change:transform;
  transform:translate3d(0,0,0) scale(1);
}
.svg-host{display:block;}
.svg-host > svg{display:block;width:100%;height:100%;}

.bg-switch{
  position:absolute;
  top:8px;right:8px;
  z-index:4;
  display:flex;
  background-color:var(--bg-surface);
  border:1px solid var(--border-default);
  border-radius:var(--r-control);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  pointer-events:auto;
}
.bg-btn{
  -webkit-appearance:none;
  appearance:none;
  width:44px;height:44px;
  border:0;
  background-color:transparent;
  cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background-color var(--duration-sm) var(--ease-out);
}
.bg-btn + .bg-btn{border-left:1px solid var(--border-default);}
.bg-btn:hover{background-color:var(--bg-subtle);}
.bg-btn[aria-pressed="true"]{background-color:var(--accent-soft);}
.bg-btn .swatch{
  width:18px;height:18px;border-radius:4px;border:1px solid var(--border-strong);
}
.bg-btn .swatch.checker{
  background-color:#FFFFFF;
  background-image:
    linear-gradient(45deg, rgba(16,24,40,.20) 25%, transparent 25%, transparent 75%, rgba(16,24,40,.20) 75%),
    linear-gradient(45deg, rgba(16,24,40,.20) 25%, transparent 25%, transparent 75%, rgba(16,24,40,.20) 75%);
  background-size:10px 10px;
  background-position:0 0, 5px 5px;
}
.bg-btn .swatch.w{background-color:#FFFFFF;}
.bg-btn .swatch.b{background-color:#101828;}

.size-badge{
  position:absolute;
  left:8px;top:8px;
  z-index:4;
  padding:4px 10px;
  font-size:12px;
  line-height:16px;
  font-variant-numeric:tabular-nums;
  color:var(--text-secondary);
  background-color:var(--bg-surface);
  border:1px solid var(--border-default);
  border-radius:var(--r-full);
  box-shadow:var(--shadow-sm);
  pointer-events:none;
  white-space:nowrap;
}

.float-bar{
  position:absolute;
  left:8px;bottom:8px;
  z-index:4;
  display:flex;
  align-items:center;
  gap:2px;
  max-width:calc(100% - 150px);
  padding:2px;
  background-color:var(--bg-surface);
  border:1px solid var(--border-default);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-md);
  pointer-events:auto;
}
.fb-btn{
  -webkit-appearance:none;
  appearance:none;
  min-width:40px;min-height:40px;
  padding:0 8px;
  border:0;
  background-color:transparent;
  color:var(--text-secondary);
  font-family:inherit;
  font-size:13px;
  line-height:20px;
  border-radius:var(--r-control);
  cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background-color var(--duration-sm) var(--ease-out),
             color var(--duration-sm) var(--ease-out),
             transform var(--duration-xs) var(--ease-out);
}
.fb-btn:hover{background-color:var(--bg-subtle);color:var(--text-primary);}
.fb-btn:active{transform:scale(0.94);}
.fb-btn svg{width:16px;height:16px;display:block;}
.fb-val{
  min-width:58px;
  font-variant-numeric:tabular-nums;
  font-weight:500;
  color:var(--text-primary);
}
@media (pointer:coarse){
  .fb-btn{min-width:44px;min-height:44px;}
}

/* Primary action: export PNG. Kept out of the menu, always one tap away. */
.fab{
  -webkit-appearance:none;
  appearance:none;
  position:absolute;
  right:12px;bottom:12px;
  z-index:5;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:52px;
  padding:0 18px;
  border:0;
  border-radius:var(--r-full);
  background-color:var(--accent);
  color:#FFFFFF;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  line-height:20px;
  letter-spacing:0.01em;
  box-shadow:var(--shadow-lg);
  cursor:pointer;
  pointer-events:auto;
  transition:transform var(--duration-md) var(--ease-out),
             background-color var(--duration-sm) var(--ease-out);
}
.fab:hover{background-color:var(--accent-hover);}
.fab:active{transform:scale(0.96);}
.fab svg{width:20px;height:20px;display:block;}

/* ============================================================
   Code
   ============================================================ */
.pane-head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:4px;
  min-height:44px;
  /* v4: 6px gap / 10+6 padding instead of 8 / 12+8 -- the row gained two
     buttons (undo, redo) and this is what keeps it inside the docked tablet
     pane without scrolling. */
  padding:4px 6px 4px 10px;
  border-bottom:1px solid var(--border-default);
  /* One step below the editor plane so the toolbar strip reads as chrome. */
  background-color:var(--bg-canvas);
  /* Reclaim a few px per action so the 字符 / 行 caption still fits beside the
     five buttons on a 390px phone (targets stay >= 44px tall). */
  /* v4: the action row grew (copy / PNG / clear / undo / redo). On a very
     narrow pane it scrolls horizontally instead of pushing buttons out of
     the pane -- same trick as the top-bar .tools strip. */
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.pane-head::-webkit-scrollbar{display:none;}
/* Scoped to the toolbar row only: the sheet keeps its roomier buttons. */
.pane-head .mini-btn{padding:0 7px;}
.pane-head .mini-btn.icon-only{padding:0;}
.meta{
  flex:1 1 auto;
  min-width:0;
  font-size:12px;line-height:16px;color:var(--text-tertiary);
  font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.meta .sep{margin:0 6px;color:var(--border-strong);}
.mini-btn{
  -webkit-appearance:none;
  appearance:none;
  flex:0 0 auto;
  min-height:36px;
  padding:0 10px;
  border:1px solid var(--border-default);
  border-radius:var(--r-control);
  background-color:var(--bg-surface);
  color:var(--text-secondary);
  font-family:inherit;
  font-size:12px;
  line-height:18px;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:background-color var(--duration-sm) var(--ease-out),
             color var(--duration-sm) var(--ease-out),
             transform var(--duration-xs) var(--ease-out);
}
.mini-btn:hover{background-color:var(--bg-subtle);color:var(--text-primary);}
.mini-btn:active{transform:scale(0.96);}
.mini-btn svg{width:14px;height:14px;display:block;}
.mini-btn.primary{
  background-color:var(--accent);border-color:var(--accent);color:#FFFFFF;font-weight:500;
}
.mini-btn.primary:hover{background-color:var(--accent-hover);border-color:var(--accent-hover);color:#FFFFFF;}
/* Disabled (e.g. undo with an empty history): greyed out AND aria-flagged,
   still a full 44px target so it never collapses the toolbar row. */
.mini-btn:disabled,
.mini-btn[aria-disabled="true"]{
  opacity:0.4;
  cursor:default;
  transform:none;
}
.mini-btn:disabled:hover,
.mini-btn[aria-disabled="true"]:hover{
  background-color:var(--bg-surface);
  color:var(--text-secondary);
}
.mini-btn.primary:disabled:hover{
  background-color:var(--accent);color:#FFFFFF;
}
/* Icon-only variant (undo / redo): 44x44 square, no label. */
.mini-btn.icon-only{
  min-width:44px;
  padding:0;
  justify-content:center;
}
@media (pointer:coarse){
  .mini-btn{min-height:44px;padding:0 12px;}
  .mini-btn.icon-only{padding:0;}
}

.tpl-bar{
  flex:0 0 auto;
  display:flex;
  gap:6px;
  padding:8px 12px;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  border-bottom:1px solid var(--border-default);
  background-color:var(--bg-canvas);
}
.tpl-bar::-webkit-scrollbar{display:none;}
.chip{
  -webkit-appearance:none;
  appearance:none;
  flex:0 0 auto;
  /* min-width keeps single-glyph labels (e.g. the "circle" chip) at >=44px
     so every chip is a legal touch target on a coarse pointer. */
  min-width:44px;
  min-height:36px;
  padding:0 12px;
  border:1px solid var(--border-default);
  border-radius:var(--r-full);
  background-color:var(--bg-surface);
  color:var(--text-secondary);
  font-family:inherit;
  font-size:13px;
  line-height:20px;
  cursor:pointer;
  white-space:nowrap;
  transition:background-color var(--duration-sm) var(--ease-out),
             color var(--duration-sm) var(--ease-out),
             border-color var(--duration-sm) var(--ease-out),
             transform var(--duration-xs) var(--ease-out);
}
.chip:hover{border-color:var(--border-strong);background-color:var(--bg-subtle);color:var(--text-primary);}
.chip:active{transform:scale(0.96);}
.chip-accent{
  border-color:var(--accent);
  color:var(--accent);
  background-color:var(--accent-soft);
  font-weight:500;
}
.chip-accent:hover{border-color:var(--accent-hover);background-color:var(--accent-soft);color:var(--accent-hover);}

.code-area{
  flex:1 1 auto;
  min-height:0;
  min-width:0;
  width:100%;
  margin:0;
  /* Extra right padding: with wrap="off" the last character stops there, so
     the text never slides under the fade / scrollbar gutter. */
  padding:12px 16px 12px 12px;
  border:0;
  resize:none;
  background-color:var(--bg-surface);
  color:var(--text-primary);
  font-family:var(--font-mono);
  font-size:13px;
  line-height:20px;
  tab-size:2;
  -webkit-appearance:none;
  appearance:none;
  outline:none;
  /* The editor keeps text selection (long press / handles) -- that is the one
     place where selection is a feature, not an accident. */
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
  touch-action:pan-x pan-y;
}
.code-area::placeholder{color:var(--text-tertiary);}

/* --- Horizontal scroll affordance (v3, phone + tablet) --------------------
   Long attributes (`viewBox="0 0 ..."` on a 360px phone) stay on one line:
   soft-wrapping would break the monospace grid and the caret/line mapping,
   which matters more while EDITING than while reading. Instead the editor
   says "there is more to the right" two ways: a slim styled scrollbar
   (::-webkit-scrollbar; Chromium 86 has no scrollbar-width) plus edge fades
   that light up only while content is hidden past that edge. The fades are
   inset by the 10px scrollbar gutter so they never paint over a thumb. */
.code-scroll{
  flex:1 1 auto;
  min-height:0;
  min-width:0;
  position:relative;
  display:flex;
  background-color:var(--bg-surface);
}
.code-fade{
  position:absolute;
  top:0;
  /* Stop above the horizontal scrollbar gutter. */
  bottom:10px;
  width:30px;
  pointer-events:none;
  opacity:0;
  transition:opacity var(--duration-sm) var(--ease-out);
}
.code-fade-right{
  /* Clear the vertical scrollbar gutter on the right. */
  right:10px;
  background-image:linear-gradient(to right, var(--code-fade-0), var(--code-fade-1));
}
.code-fade-left{
  left:0;
  width:24px;
  background-image:linear-gradient(to left, var(--code-fade-0), var(--code-fade-1));
}
.code-scroll.can-right .code-fade-right,
.code-scroll.can-left .code-fade-left{opacity:1;}
.code-area::-webkit-scrollbar{width:10px;height:10px;}
.code-area::-webkit-scrollbar-track{background-color:transparent;}
.code-area::-webkit-scrollbar-thumb{
  background-color:var(--border-strong);
  border:3px solid transparent;
  border-radius:8px;
  background-clip:padding-box;
}
.code-area::-webkit-scrollbar-thumb:hover{background-color:var(--text-tertiary);}
.code-area::-webkit-scrollbar-corner{background-color:transparent;}

.err-bar{
  flex:0 0 auto;
  /* v4: [message][下一处] laid out as a row. min-height keeps the whole strip
     a legal touch target, because tapping anywhere in it jumps to the error. */
  display:flex;
  align-items:center;
  gap:8px;
  min-height:44px;
  padding:8px 12px;
  font-size:12px;
  line-height:18px;
  color:var(--danger);
  background-color:var(--danger-soft);
  border-top:1px solid var(--danger);
  max-height:120px;
  overflow:auto;
  word-break:break-word;
  cursor:pointer;
}
/* `display:flex` above would otherwise beat the UA `display:none` for [hidden]
   and leave an empty 44px strip pinned under the editor. */
.err-bar[hidden]{display:none;}
.err-text{flex:1 1 auto;min-width:0;}
.err-bar .mini-btn{flex:0 0 auto;}
.err-bar .mini-btn[hidden]{display:none;}
/* Amber tone: the SVG parsed fine but the scanner still found something
   (e.g. a duplicate id). Not a parse failure, so not a red "解析错误". */
.err-bar[data-tone="warn"]{
  color:var(--warning);
  background-color:rgba(220,104,3,0.08);
  border-top-color:var(--warning);
}
.err-bar[data-tone="warn"] .mini-btn{color:var(--warning);}

/* ============================================================
   Bottom tab bar (phone)
   ============================================================ */
.tabbar{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:30;
  background-color:var(--bg-surface);
  /* Bottom chrome casts upward: same rule as the app bar, mirrored. */
  border-top:1px solid var(--border-strong);
  box-shadow:var(--shadow-bar-up);
  height:calc(var(--h-tabbar) + env(safe-area-inset-bottom, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px);
  flex:0 0 auto;
  /* Explicitly re-enabled: it lives outside .pane, but a future wrapper with
     pointer-events:none would silently kill it (that was BUG-1 in v1). */
  pointer-events:auto;
}
.tabbar-track{
  position:relative;
  display:flex;
  align-items:stretch;
  height:var(--h-tabbar);
}
.tab{
  -webkit-appearance:none;
  appearance:none;
  flex:1 1 0;
  min-width:0;
  min-height:var(--h-tabbar);
  border:0;
  background-color:transparent;
  color:var(--text-tertiary);
  font-family:inherit;
  font-size:13px;
  font-weight:400;
  line-height:20px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  pointer-events:auto;
  transition:color var(--duration-sm) var(--ease-out);
}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600;}
.tab svg{width:18px;height:18px;display:block;}
/* Liquid indicator: transform only, no layout. */
.tab-ind{
  position:absolute;
  left:0;top:0;
  width:100px;height:2px;
  background-color:var(--accent);
  border-radius:2px;
  transform-origin:left center;
  transform:translateX(0) scaleX(0);
  pointer-events:none;
}
.tab-ind.anim{transition:transform 220ms var(--ease-spring);}

/* ============================================================
   Status bar
   ============================================================ */
.statusbar{
  flex:0 0 auto;
  height:var(--h-status);
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 12px;
  background-color:var(--bg-surface);
  border-top:1px solid var(--border-strong);
  box-shadow:var(--shadow-bar-up);
  font-size:12px;
  line-height:16px;
  color:var(--text-secondary);
  overflow:hidden;
  white-space:nowrap;
  pointer-events:auto;
}
.status-item{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;}
.status-item .dot{width:6px;height:6px;border-radius:var(--r-full);flex:0 0 auto;}
.status-spacer{flex:1 1 auto;}
.status-item.mono{font-variant-numeric:tabular-nums;}
.status-hide-sm{display:none;}
/* Phone: the status strip is a caption, not a second bar. 22px + tertiary
   text keeps it clearly subordinate to the 56px tab bar below it, so the
   bottom of the screen no longer stacks two equal-height bars (v3). The
   surface background / top border / upward shadow stay: the hierarchy and
   the QA contract for them are unchanged. */
@media (max-width:767px){
  .statusbar{
    height:22px;
    gap:10px;
    padding:0 10px;
    font-size:11px;
    line-height:14px;
    color:var(--text-tertiary);
  }
  .status-item .dot{width:5px;height:5px;}
}

/* ============================================================
   Toast
   ============================================================ */
.toast{
  position:fixed;
  left:50%;
  bottom:calc(var(--h-tabbar) + env(safe-area-inset-bottom, 0px) + 48px);
  z-index:60;
  transform:translateX(-50%) translateY(8px);
  max-width:calc(100vw - 32px);
  padding:8px 14px;
  border-radius:var(--r-full);
  background-color:var(--text-primary);
  color:var(--bg-surface);
  font-size:13px;
  line-height:20px;
  box-shadow:var(--shadow-md);
  opacity:0;
  pointer-events:none;
  transition:opacity var(--duration-md) var(--ease-out),
             transform var(--duration-md) var(--ease-out);
}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============================================================
   Rename hint bubble (one-shot, non-blocking)
   ============================================================ */
.hint-bubble{
  position:fixed;
  left:12px;top:56px;
  z-index:70;
  max-width:calc(100vw - 24px);
  padding:8px 12px;
  background-color:var(--accent);
  color:#FFFFFF;
  font-size:12px;
  line-height:18px;
  font-weight:500;
  border-radius:var(--r-control);
  box-shadow:var(--shadow-md);
  opacity:0;
  /* Font audit (v4): the old idle state was `scale(0.96)`, i.e. 12px text
     rasterised at a fractional scale -- permanently soft. Translate-only
     keeps the pop-in without ever scaling the glyphs. */
  transform:translate3d(0,-6px,0);
  transform-origin:left top;
  pointer-events:none;
  transition:opacity var(--duration-md) var(--ease-out),
             transform var(--duration-md) var(--ease-out);
}
.hint-bubble.is-on{opacity:1;transform:translate3d(0,0,0);}
.hint-bubble::after{
  content:"";
  position:absolute;
  top:-4px;left:20px;
  width:10px;height:10px;
  background-color:var(--accent);
  border-radius:2px;
  transform:rotate(45deg);
}

/* ============================================================
   Settings bottom sheet
   ============================================================ */
.sheet-root{position:fixed;inset:0;z-index:80;}
.sheet-root[hidden]{display:none;}
.sheet-mask{
  position:absolute;inset:0;
  background-color:var(--overlay);
  opacity:0;
  transition:opacity var(--duration-lg) var(--ease-out);
}
.sheet-root.is-on .sheet-mask{opacity:1;}
.sheet{
  position:absolute;
  left:0;right:0;bottom:0;
  max-height:86%;
  display:flex;
  flex-direction:column;
  background-color:var(--bg-surface);
  border-top:1px solid var(--border-strong);
  border-radius:16px 16px 0 0;
  box-shadow:var(--shadow-lg);
  transform:translate3d(0,100%,0);
  transition:transform var(--duration-lg) var(--ease-out);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.sheet-root.is-on .sheet{transform:translate3d(0,0,0);}
.sheet.is-dragging{transition:none;}
.sheet-grip{
  flex:0 0 auto;
  height:22px;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;
  cursor:grab;
}
.sheet-grip span{
  width:40px;height:4px;border-radius:var(--r-full);
  background-color:var(--border-strong);
}
.sheet-head{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  min-height:48px;
  padding:0 6px 0 16px;
  border-bottom:1px solid var(--border-default);
}
.sheet-title{
  flex:1 1 auto;min-width:0;
  margin:0;
  font-size:15px;font-weight:600;line-height:20px;color:var(--text-primary);
}
.sheet-body{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:0 16px 16px;
}
.set-sec{padding:12px 0 8px;border-bottom:1px solid var(--border-default);}
.set-sec:last-child{border-bottom:0;}
.set-h{
  margin:0 0 6px;
  font-size:12px;font-weight:600;line-height:16px;
  color:var(--text-tertiary);
}
.set-row{display:flex;align-items:center;gap:8px;min-height:48px;padding:2px 0;}
.set-row-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
.set-row-label{font-size:13px;font-weight:500;line-height:18px;color:var(--text-primary);}
.set-row-path,.set-row-val{
  max-width:100%;
  font-size:12px;line-height:16px;color:var(--text-tertiary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--font-mono);
}
.set-row-val{font-family:inherit;}
.set-note{
  margin:4px 0 6px;
  padding:8px 10px;
  font-size:12px;line-height:18px;
  color:var(--text-secondary);
  background-color:var(--bg-canvas);
  border:1px solid var(--border-default);
  border-radius:var(--r-control);
  /* A saved directory is one unbreakable token; without this it stretches the
     sheet wider than the screen. */
  overflow-wrap:anywhere;
  word-break:break-word;
}
.set-note[data-tone="warn"]{
  color:var(--warning);
  background-color:rgba(220,104,3,0.08);
  border-color:rgba(220,104,3,0.35);
}
.set-wide{
  -webkit-appearance:none;appearance:none;
  width:100%;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 12px;
  border:1px solid var(--border-default);
  border-radius:var(--r-control);
  background-color:var(--bg-surface);
  color:var(--text-primary);
  font-family:inherit;font-size:13px;line-height:20px;
  cursor:pointer;
  transition:background-color var(--duration-sm) var(--ease-out),
             transform var(--duration-xs) var(--ease-out);
}
.set-wide:hover{background-color:var(--bg-subtle);}
.set-wide:active{transform:scale(0.98);}
.set-wide svg{width:16px;height:16px;display:block;}
.seg{
  display:flex;gap:4px;padding:2px;
  background-color:var(--bg-canvas);
  border:1px solid var(--border-default);
  border-radius:var(--r-control);
}
.seg-btn{
  -webkit-appearance:none;appearance:none;
  flex:1 1 0;min-width:0;min-height:44px;
  border:0;border-radius:4px;
  background-color:transparent;
  color:var(--text-secondary);
  font-family:inherit;font-size:13px;line-height:20px;
  cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background-color var(--duration-sm) var(--ease-out),
             color var(--duration-sm) var(--ease-out);
}
.seg-btn:hover{color:var(--text-primary);}
.seg-btn[aria-pressed="true"]{
  background-color:var(--bg-surface);
  color:var(--accent);
  font-weight:600;
  box-shadow:var(--shadow-sm);
}
.path-edit{display:flex;align-items:center;gap:8px;padding:4px 0 8px;}
.path-edit[hidden]{display:none;}
.path-input{
  flex:1 1 auto;min-width:0;height:44px;
  padding:0 10px;
  font-family:var(--font-mono);font-size:13px;line-height:20px;
  color:var(--text-primary);
  background-color:var(--bg-surface);
  border:1px solid var(--border-strong);
  border-radius:var(--r-control);
  -webkit-appearance:none;appearance:none;
  outline:none;
  text-overflow:ellipsis;
  -webkit-user-select:text;user-select:text;
}
.path-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}

/* ============================================================
   Onboarding coach marks (mask + focus hole + card)
   ============================================================ */
.tour{position:fixed;inset:0;z-index:90;}
.tour[hidden]{display:none;}
/* Transparent but click-eating: blocks everything underneath while the hole's
   giant spread shadow paints the dimming. */
.tour-mask{position:absolute;inset:0;background-color:transparent;}
.tour-hole{
  position:absolute;
  left:0;top:0;
  width:0;height:0;
  border-radius:12px;
  pointer-events:none;
  box-shadow:0 0 0 9999px var(--overlay), inset 0 0 0 2px var(--accent);
  opacity:0;
  transition:opacity var(--duration-sm) var(--ease-out);
}
.tour.is-on .tour-hole{opacity:1;}
.tour-card{
  position:absolute;
  left:12px;right:12px;
  margin:0 auto;
  max-width:440px;
  padding:12px 14px 12px;
  background-color:var(--bg-surface);
  border:1px solid var(--border-strong);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-lg);
  opacity:0;
  transform:translate3d(0,12px,0);
  transition:opacity var(--duration-md) var(--ease-out),
             transform var(--duration-md) var(--ease-out);
}
.tour.is-on .tour-card{opacity:1;transform:translate3d(0,0,0);}
.tour-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.tour-step{
  font-size:12px;line-height:16px;font-weight:600;
  color:var(--accent);font-variant-numeric:tabular-nums;
}
.tour-spacer{flex:1 1 auto;}
.tour-skip{
  -webkit-appearance:none;appearance:none;
  min-height:44px;padding:0 8px;
  border:0;border-radius:var(--r-control);
  background-color:transparent;
  color:var(--text-secondary);
  font-family:inherit;font-size:13px;line-height:20px;
  cursor:pointer;
}
.tour-skip:hover{background-color:var(--bg-subtle);color:var(--text-primary);}
.tour-title{
  margin:0 0 4px;
  font-size:15px;font-weight:600;line-height:20px;color:var(--text-primary);
}
.tour-text{margin:0 0 10px;font-size:13px;line-height:20px;color:var(--text-secondary);}
.tour-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;}
.tour-actions .mini-btn{min-width:92px;justify-content:center;}
.tour-actions .mini-btn[hidden]{display:none;}

/* ============================================================
   Staggered reveal
   ============================================================ */
/* The editor toolbar row gained two actions (undo, redo). On a phone the
   character / line caption still has to read in full, so it drops the
   separator margin and matches the 11px of the phone status strip. */
@media (max-width:479px){
  .pane-head{padding-left:8px;padding-right:4px;}
  .pane-head .mini-btn{padding:0 6px;}
  .pane-head .mini-btn.icon-only{padding:0;}
  .pane-head .meta{font-size:11px;line-height:16px;}
  .pane-head .meta .sep{margin:0 2px;}
}
/* When one row genuinely cannot hold both (narrow phones, and the ~360px
   docked code pane on tablets) the caption takes its own line instead of
   being clipped down to "1…". Everything stays a single row at 390-767px
   and on wide docks, which is where the row already fits. */
@media (max-width:389px), (min-width:768px) and (max-width:1099px){
  .pane-head{flex-wrap:wrap;row-gap:2px;}
  .pane-head .meta{flex:1 1 100%;}
}

@keyframes stg-in{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
.stg{animation:stg-in var(--duration-lg) var(--ease-out) both;}

/* ============================================================
   Tablet (>=768px): preview docked left, editor on the right
   ============================================================ */
@media (min-width:768px){
  body{padding-bottom:0;}
  .app{display:flex;flex-direction:row;}
  .pane-preview{
    position:relative;
    inset:auto;
    /* v4: 58/42 -> 56/44 so the editor toolbar row (5 buttons now) fits
       without scrolling. Preview stays inside the 55-60% contract. */
    flex:1 1 56%;
    min-width:0;
    /* Structural divider between the two docked panes. */
    border-right:1px solid var(--border-strong);
    opacity:1 !important;
    visibility:visible !important;
    pointer-events:auto !important;
    transform:none !important;
  }
  .pane-code{
    position:relative;
    inset:auto;
    flex:1 1 44%;
    min-width:0;
    opacity:1 !important;
    visibility:visible !important;
    pointer-events:auto !important;
    transform:none !important;
  }
  .tabbar{display:none;}
  .toast{bottom:calc(var(--h-status) + env(safe-area-inset-bottom, 0px) + 24px);}
  .bg-btn{width:40px;height:40px;}
  .status-hide-sm{display:inline-flex;}
  .fab{min-height:48px;padding:0 16px;}
  /* Wide screens get a centred sheet instead of an edge-to-edge one. */
  .sheet{
    left:50%;right:auto;
    width:520px;
    margin-left:-260px;
    max-height:80%;
  }
}
@media (min-width:1100px){
  .pane-preview{flex:1 1 60%;}
  .pane-code{flex:1 1 40%;}
}

/* Coarse pointer: every tap target >= 44px */
@media (pointer:coarse){
  .chip{min-height:44px;}
}

/* ============================================================
   Reduced motion
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;

    try { ta.setSelectionRange(s, e); } catch (err) { /* ignore */ }

    els.btnUndo.setAttribute('aria-disabled', canUndo ? 'false' : 'true');
    els.btnRedo.disabled = !canRedo;
    els.btnRedo.setAttribute('aria-disabled', canRedo ? 'false' : 'true');

    els.btnClear.setAttribute('aria-disabled', canClear ? 'false' : 'true');

    if (!undoStack.length) { toast('没有可撤销的操作'); return false; }
    redoStack.push(snapshotCurrent());
    if (redoStack.length > UNDO_MAX) { redoStack.shift(); }
    var entry = undoStack.pop();

    setEditorValue(entry.v, entry.s, entry.e);
    syncEditorButtons();
    return true;

    var lo = 0, hi = starts.length - 1, mid;
    while (lo < hi) {

  function scanSvgSyntax(text) {
    var src = String(text == null ? '' : text);

    function add(start, end, msg) {
      if (out.length >= LINT_MAX) { return; }
      var li = lineIndexOf(starts, start);

    var ids = {};          // id -> true, for duplicate detection
    var sawSvg = false;
    var p = 0;

    while (p < n) {

      /* ---- text content ------------------------------------------------ */

        continue;
      }

      /* ---- comment / CDATA / doctype / processing instruction ---------- */
      if (src.substr(p, 4) === '<!--') {
        var ce = src.indexOf('-->', p + 4);
        p = (ce === -1) ? n : ce + 3;
        continue;
      }
      if (src.substr(p, 9) === '<![CDATA[') {
        var de = src.indexOf(']]>', p + 9);
        p = (de === -1) ? n : de + 3;
        continue;
      }
      if (src.charAt(p + 1) === '!') {
        var ge = src.indexOf('>', p + 2);
        p = (ge === -1) ? n : ge + 1;
        continue;
      }
      if (src.charAt(p + 1) === '?') {
        var qe = src.indexOf('?>', p + 2);
        p = (qe === -1) ? n : qe + 2;
        continue;
      }

      /* ---- closing tag ------------------------------------------------- */
      if (src.charAt(p + 1) === '/') {
        var q = p + 2;
        var cStart = q;
        while (q < n && RE_TAG_NAME.test(src.charAt(q))) { q++; }
        var cName = src.slice(cStart, q);
        var cgt = src.indexOf('>', q);
        var cEnd = (cgt === -1) ? n : cgt + 1;
        if (!cName) {
          add(p, cEnd, '闭合标签缺少名称');
        } else {
          var top = stack.length ? stack[stack.length - 1] : null;
          if (!top) {
            add(p, cEnd, '多余的闭合标签 </' + cName + '>');
          } else if (top.name !== cName) {
            add(p, cEnd, '闭合标签 </' + cName + '> 与 <' + top.name + '> 不匹配');
            // Recover: if that name is open further down, close everything
            // above it so the remaining tags still pair up correctly.
            var found = -1;
            for (var s = stack.length - 1; s >= 0; s--) {
              if (stack[s].name === cName) { found = s; break; }
            }
            if (found >= 0) { stack.length = found; }
          } else {
            stack.pop();
          }
        }
        p = cEnd;
        continue;
      }

      /* ---- opening tag -------------------------------------------------- */
      var k = p + 1;
      if (k >= n || !RE_NAME_START.test(src.charAt(k))) {
        add(p, p + 1, '多余的 < 符号');
        p++;
        continue;
      }
      var tStart = k;
      while (k < n && RE_TAG_NAME.test(src.charAt(k))) { k++; }
      var tName = src.slice(tStart, k);
      if (tName.toLowerCase() === 'svg') { sawSvg = true; }

      var selfClose = false;
      var tagEnd = -1;
      var tagBroken = false;
      var a = k;

      while (a < n) {
        var c = src.charAt(a);
        if (c === '>') { tagEnd = a + 1; break; }
        if (c === '/' && src.charAt(a + 1) === '>') { selfClose = true; tagEnd = a + 2; break; }
        if (c === '<') {
          // Another tag started before this one was closed.
          add(p, a, '<' + tName + '> 标签未闭合');
          tagEnd = a;
          tagBroken = true;
          break;
        }
        if (/\s/.test(c)) { a++; continue; }

        var nStart = a;
        while (a < n && RE_ATTR_NAME.test(src.charAt(a))) { a++; }
        var aName = src.slice(nStart, a);
        if (!aName) { a++; continue; }

        var v = a;
        while (v < n && /\s/.test(src.charAt(v))) { v++; }
        if (src.charAt(v) !== '=') { a = v; continue; }   // valueless attribute
        v++;
        while (v < n && /\s/.test(src.charAt(v))) { v++; }

        var quote = src.charAt(v);
        if (quote === '"' || quote === "'") {
          var close = src.indexOf(quote, v + 1);
          var gtAt = src.indexOf('>', v + 1);
          if (close === -1 || (gtAt !== -1 && gtAt < close)) {
            add(nStart, (close === -1 ? n : close + 1), '属性 ' + aName + ' 的引号未闭合');
            tagEnd = n;
            tagBroken = true;
            break;
          }
          if (aName.toLowerCase() === 'id') {
            var idVal = src.slice(v + 1, close).trim();
            if (idVal) {
              if (ids[idVal]) { add(nStart, close + 1, 'id "' + idVal + '" 重复定义'); }

        // Unquoted value: legal in loose HTML, always wrong in SVG/XML.
        while (v < n && !/[\s><]/.test(src.charAt(v))) { v++; }

      }

      if (tagEnd === -1) {
        add(p, n, '<' + tName + '> 标签未闭合');
        p = n;
        continue;
      }
      if (!selfClose && !tagBroken) { stack.push({ name: tName, start: p }); }
      p = tagEnd;
    }

    // Anything still open at EOF: report the innermost first.
    for (var z = stack.length - 1; z >= 0; z--) {
      add(stack[z].start, stack[z].start + stack[z].name.length + 1,
        '<' + stack[z].name + '> 标签未闭合');
    }
    if (!sawSvg && out.length < LINT_MAX) {
      out.unshift({ line: 1, col: 1, start: 0, end: Math.min(1, n), msg: '缺少 <svg> 根元素' });
    }
    return out;
  }

    var idx = clamp(state.lintIndex, 0, list.length - 1);
    state.lintIndex = idx;
    if (list.length > 1) {
      els.errText.textContent = '发现 ' + list.length + ' 处问题 · ' +
        (idx + 1) + '/' + list.length + '：' + lintLabel(list[idx]);
      els.errNext.hidden = false;
    } else {
      els.errText.textContent = '发现 1 处问题：' + lintLabel(list[0]);

    var ta = els.code;
    try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); }
    try { ta.setSelectionRange(err.start, Math.min(err.end, ta.value.length)); }
    catch (e) { /* ignore */ }

    renderLintBar();

    var list = state.lint || [];
    if (!list.length) { return; }

    if (!res.el) {
      showError(res.error, res.error, lint);

    if (res.loose) {
      // Tolerant fallback must NOT silently replace a working preview.
      showError('结构不完整，请检查标签是否闭合', res.error, lint);
      return false;
    }
    hideError();

    state.svgEl = res.el;
    state.source = String(text);
    renderSvgToHost();
    buildCount();
    computeBase();
    if (!opts.keepView) { view.k = 1; view.x = 0; view.y = 0; }
    applyView();
    /* Parsed fine but the scanner still found something (duplicate id, ...):
       amber bar, last render untouched, status flagged. */
    state.lint = lint;
    state.lintIndex = 0;
    if (lint.length) { showLintOnly(lint); }

    var found = state.svgEl.querySelectorAll(SELECTABLE);
    var n = 0, i, el;
    for (i = 0; i < found.length; i++) {
      el = found[i];
      if (el === state.svgEl) { continue; }

  /* ============================================================
     13. Persistence
     ============================================================ */

    } catch (e) {}

    if (!booting && prev.v !== String(text)) {
      closeUndoBurst();
      pushUndo(prev.v, prev.s, prev.e);
      redoStack.length = 0;
    }
    endProgrammaticEdit();
    updateMeta();
    if (name) { els.fileName.value = name; }
    var ok = applySource(text, { keepView: false });
    if (ok) { fitToScreen(); }
    scheduleSave();
    return ok;
  }

  function fileNameSafe() {
    var n = (els.fileName.value || '').trim() || 'untitled.svg';
    if (!/\.svg$/i.test(n)) { n += '.svg'; }
    return n;
  }
  function pngName() {
    return fileNameSafe().replace(/\.svg$/i, '') + '.png';
  }
  els.fileName.addEventListener('change', function () {
    els.fileName.value = fileNameSafe();
    scheduleSave();
  });
  els.fileName.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { els.fileName.blur(); }
    else if (e.key === 'Escape') { els.fileName.value = state.savedName || 'untitled.svg'; els.fileName.blur(); }
  });
  els.fileName.addEventListener('focus', function () {
    state.savedName = els.fileName.value;
    /* First focus doubles as the cue: if the boot bubble never fired, show it
       now; otherwise get it out of the way of the caret. */
    if (!els.hintBubble.classList.contains('is-on')) { showRenameHint(false); }
    else { hideRenameHint(); }
  });

  function download(blob, filename) {
    var url = URL.createObjectURL(blob);

    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) { a.parentNode.removeChild(a); }
      URL.revokeObjectURL(url);
    }, 1000);
  }

  /* ============================================================
     14. Open / save / copy / export (all bridge-aware)
     ============================================================ */
  function requestOpen() {

    if (r.ok) { return; }          // SvgViewNative / Android system picker
    els.fileInput.click();         // browser fallback
  }

  function saveSvg(text, fileName) {

        // success, "" on failure. Hosts that return void get the generic
        // message -- r.ok alone is true whenever the method merely exists.
        var res = n.saveSvg(text, name);
        if (typeof res === 'string') {
          if (res) { toast('已保存 ' + res); }
        } else {

        return;
      } catch (e) { /* fall through */ }

      // source out via the clipboard instead of failing silently.

  els.btnOpen.addEventListener('click', function () { requestOpen(); });
  els.fileInput.addEventListener('change', function () {

    reader.onload = function () {
      var ok = loadDocument(String(reader.result || ''), f.name, {});

    ta.style.left = '0';

    var size = getSvgSize(state.svgEl);
    var clone = state.svgEl.cloneNode(true);

      toast('PNG 导出失败：SVG 可能包含外部引用');

  els.btnPng2.addEventListener('click', exportPng);

      var cs = null;
      try { cs = getComputedStyle(el); } catch (e) { cs = null; }

    var card = els.tourCard;

    var vh = window.innerHeight;
    var top;
    if (holeBottom + 12 + h <= vh - 12) { top = holeBottom + 12; }
    else if (holeTop - 12 - h >= 12) { top = holeTop - 12 - h; }
    else { top = Math.max(12, vh - h - 12); }
    card.style.top = Math.round(top) + 'px';

  function tourRender() {
    var step = TOUR_STEPS[tourIndex];

    /* A step may live inside a pane that is not on screen (phone tabs):
       switch views first, then measure. */
    if (step.view) { setView(step.view, { focus: false }); }

    els.tourStep.textContent = (tourIndex + 1) + '/' + TOUR_STEPS.length;
    els.tourTitle.textContent = step.title;
    els.tourText.textContent = step.text;
    els.tourPrev.hidden = (tourIndex === 0);
    els.tourNext.textContent = (tourIndex === TOUR_STEPS.length - 1) ? '开始使用' : '下一步';

    var found = resolveTarget(step);
    if (!found) {
      els.tourHole.style.opacity = '0';
      els.tourHole.style.width = '0px';
      els.tourHole.style.height = '0px';
      placeTourCard(window.innerHeight / 2, window.innerHeight / 2);

       the target sat within `pad` of an edge (e.g. the app-bar gear). Let the

    els.tourHole.style.transform = 'translate3d(' + Math.round(left) + 'px,' + Math.round(top) + 'px,0)';

      if (tourActive) { scheduleRenameHint(600); return; }
      showRenameHint(false);
    }, delay);
  }

  /* ============================================================
     21. Boot
     ============================================================ */
  function initStagger() {
    if (reduceMotion) { return; }
    var btns = els.tools.querySelectorAll('.icon-btn');
    for (var i = 0; i < btns.length && i < STAGGER_MAX; i++) {
      btns[i].className += ' stg';
      btns[i].style.animationDelay = (i * STAGGER_STEP) + 'ms';
    }
  }

  function boot() {
    syncViewportHeight();
    initTheme();
    initStagger();

    var restored = false;
    var doc = null;
    try {
      var raw = localStorage.getItem(STORE_DOC);
      if (raw) { doc = JSON.parse(raw); }
    } catch (e) { doc = null; }

    var text = SAMPLE, name = 'untitled.svg';
    if (doc && typeof doc.source === 'string' && doc.source.trim()) {
      text = doc.source;
      name = doc.name || 'untitled.svg';
      restored = true;
      if (doc.bg) { state.bg = doc.bg; }
    }
    setBg(state.bg);

    /* v5: backfill the export rows from the host before the sheet is ever
       opened, so what the user sees is the real directory and not a stale
       cache (or the default label) from a previous install. */
    renderExportDir('svg');
    renderExportDir('png');
    renderPathNote('');

    els.fileName.value = name;
    els.code.value = text;
    updateMeta();
    applySource(text, { keepView: false });
    fitToScreen();

    setView(isTablet() ? 'code' : 'preview', { focus: false });
    requestAnimationFrame(function () {
      moveIndicator(false);
      setTimeout(function () { els.tabInd.classList.add('anim'); }, 0);
    });

    if (restored) { toast('已恢复上次编辑'); }
    buildCount();
    SvgApp.ready = true;
    booting = false;   // from here on, source changes are undoable

    /* First run ever: walk the coach marks. Every later run just gets the
       one-shot rename hint (and only if it has not fired before). */
    if (!SKIP_AUTO_TOUR && !storeHas(STORE_ONBOARDED)) {
      setTimeout(function () { startTour(); }, TOUR_SHOW_DELAY);
    } else {
      scheduleRenameHint(HINT_SHOW_DELAY);
    }
  }

  /* ---------- global events ---------- */
  var resizeTimer = 0;
  function onViewportChange() {
    syncViewportHeight();
    /* The gesture code caches the viewport origin for the duration of a
       gesture; any resize makes it stale. */
    vpRect = null;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      computeBase();
      applyView();
      moveIndicator(false);
      /* Editor edge fades depend on the viewport width. */
      syncCodeScrollHints();
      /* Rotation / keyboard: the highlighted element moved, so re-aim. */
      if (tourActive) { tourRender(); }
      if (sheetOpen) { /* sheet is bottom-anchored, nothing to reflow */ }
    }, 120);
  }
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', function () {
    setTimeout(onViewportChange, 300);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onViewportChange);
    window.visualViewport.addEventListener('scroll', syncViewportHeight);
  }

  /* Esc closes the topmost layer: coach marks first, then the settings sheet. */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' && e.key !== 'Esc') { return; }
    if (tourActive) { endTour(true); return; }
    if (sheetOpen) { closeSheet(); }
  });

  /* Block the browser-level pinch zoom that `user-scalable=no` cannot stop
     on some WebView builds; multi-touch still reaches the canvas. */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  boot();
})();
</script>
</body>
</html>
